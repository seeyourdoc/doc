<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeeYourDoctor</title><link rel="stylesheet" href="css/style.css">
</head><body>
<header id="site-header" class="site"></header>
<main><div class="wrap hero">
  <img class="logo" src="assets/logo.png" alt="SeeYourDoctor logo">
  <div class="word" id="word">SEEYOURDOCTOR</div>
  <p class="tag">Online Doctor Consultation</p>
  <div class="stack">
    <a id="book" class="btn btn-primary" href="book.html">BOOK A DOCTOR NOW</a>
    <div id="countdown" class="hidden"></div>
    <a id="support" class="btn btn-outline" href="contribute.html">CONTRIBUTE / SUPPORT THE DOCTOR</a>
  </div>
  <p style="margin-top:26px"><a href="return.html">Already booked? Return to your consultation</a></p>
</div></main>
<footer id="site-footer" class="site"></footer>
<script src="js/config.js"></script><script src="js/common.js"></script>
<script>
(async () => {
  let s;
  try { s = await loadSite(); } catch { $('#countdown').className = 'closed-note'; $('#countdown').textContent = 'The service is temporarily unavailable. Please try again shortly.'; return; }
  $('#word').textContent = s.site_name.toUpperCase();
  if (!s.contributions_enabled) $('#support').classList.add('hidden');
  const offset = new Date(s.server_time).getTime() - Date.now(); // use server time, not the visitor's clock
  const box = $('#countdown');
  const book = $('#book');
  const reasons = { paused: 'Booking is currently paused.', not_started: 'Booking has not opened yet.', ended: 'Booking is currently closed.', countdown_ended: 'Booking is currently closed.' };

  function closed(reason) {
    book.setAttribute('aria-disabled', 'true'); book.removeAttribute('href'); book.onclick = (e) => e.preventDefault();
    box.className = 'closed-note'; box.textContent = reasons[reason] || 'Booking is currently closed.';
    if (reason === 'not_started' && s.booking_start) box.textContent = `Booking opens ${fmtDT(s.booking_start)}.`;
  }
  if (!s.booking.open) return closed(s.booking.reason);
  if (!s.countdown.enabled) return;

  const target = new Date(s.countdown.target).getTime();
  box.className = 'countdown';
  box.setAttribute('role', 'timer');
  const pad = (n) => String(n).padStart(2, '0');
  function tick() {
    let ms = target - (Date.now() + offset);
    if (ms <= 0) { closed('countdown_ended'); clearInterval(timer); return; }
    const t = Math.floor(ms / 1000), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
    const unit = (n, u) => `<div class="unit"><div class="num">${pad(n)}</div><div class="u">${u}</div></div>`;
    box.innerHTML = `<div class="label">Doctor Booking Available For:</div><div class="digits">${unit(d, 'DAYS')}<span class="sep">:</span>${unit(h, 'HOURS')}<span class="sep">:</span>${unit(m, 'MINUTES')}<span class="sep">:</span>${unit(sec, 'SECONDS')}</div>`;
  }
  const timer = setInterval(tick, 1000); tick();
})();
</script></body></html>
