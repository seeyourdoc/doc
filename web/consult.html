<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>Consultation</title><link rel="stylesheet" href="css/style.css">
</head><body>
<header id="site-header" class="site"></header>
<main><div class="wrap" style="max-width:860px">
  <div id="head"></div>
  <div id="msg" class="hidden"></div>
  <section id="chat" class="chat hidden">
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="composer"><textarea id="box" placeholder="Type your message" maxlength="4000" aria-label="Message"></textarea><button class="btn btn-primary" id="send">Send</button></div>
  </section>
  <section id="video" class="hidden">
    <div class="video"><div id="remote"></div><div class="local" id="local"></div><div class="wait" id="wait">Press “Join video consultation” to start.</div></div>
    <div class="center" style="margin-top:10px"><span class="status" id="conn">Not connected</span></div>
    <div class="vctl" id="vctl"><button class="btn btn-primary btn-sm" id="join">Join video consultation</button></div>
    <div id="audio"></div>
  </section>
</div></main>
<footer id="site-footer" class="site"></footer>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/consult.js"></script>
</body></html>
