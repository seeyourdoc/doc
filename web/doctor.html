<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Doctor dashboard</title><link rel="stylesheet" href="css/style.css">
</head><body>
<header id="site-header" class="site"></header>
<main><div class="wrap">
  <h1>Your consultations</h1>
  <div id="list"><div class="spinner"></div></div>
</div></main>
<footer id="site-footer" class="site"></footer>
<script src="js/config.js"></script><script src="js/common.js"></script>
<script>
(async () => {
  if (!staff.get()) { location.href = 'login.html'; return; }
  loadSite({ title: 'Doctor dashboard', nav: '<nav><button class="btn btn-outline btn-sm" id="out">Sign out</button></nav>' }).then(() => { $('#out').onclick = () => { staff.clear(); location.href = 'login.html'; }; });
  const day = (d) => new Date(d).toDateString();
  const card = (c) => `<div class="cons"><div><strong>${esc(c.patient_name)}</strong><div class="muted" style="font-size:.88rem">${esc(c.package_name)} (${esc(c.duration_label)}) · ${c.consultation_type === 'chat' ? 'Chat' : 'Video'} · ${esc(fmtDT(c.starts_at))}</div></div><div><span class="badge b-${c.status === 'expired' ? 'completed' : c.status}">${c.status === 'expired' ? 'completed' : c.status}</span> ${c.status === 'active' ? `<a class="btn btn-primary" href="consult.html?room=${c.id}">${c.consultation_type === 'chat' ? 'OPEN CHAT' : 'JOIN VIDEO'}</a>` : ''}</div></div>`;
  const group = (t, items) => `<div class="group"><h2>${t}</h2>${items.length ? items.map(card).join('') : '<p class="empty">None.</p>'}</div>`;
  async function load() {
    try {
      const { consultations: all } = await api('/api/doctor/consultations', { auth: true });
      const today = new Date().toDateString();
      $('#list').innerHTML =
        group("Today's consultations", all.filter((c) => day(c.starts_at) === today && c.status !== 'terminated')) +
        group('Active consultations', all.filter((c) => c.status === 'active')) +
        group('Upcoming consultations', all.filter((c) => c.status === 'scheduled')) +
        group('Completed consultations', all.filter((c) => c.status === 'expired' || c.status === 'terminated'));
    } catch (e) { $('#list').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  }
  load(); setInterval(load, 30000);
})();
</script></body></html>
