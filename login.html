<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Staff sign in</title><link rel="stylesheet" href="css/style.css">
</head><body>
<header id="site-header" class="site"></header>
<main><div class="wrap" style="max-width:420px">
  <h1>Staff sign in</h1>
  <form class="card" id="f">
    <div id="err" class="err hidden" role="alert"></div>
    <label class="f" for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label class="f" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary" style="margin-top:20px" id="go">SIGN IN</button>
  </form>
</div></main>
<footer id="site-footer" class="site"></footer>
<script src="js/config.js"></script><script src="js/common.js"></script>
<script>
loadSite({ title: 'Staff sign in' });
$('#f').onsubmit = async (e) => {
  e.preventDefault(); const b = $('#go'); b.disabled = true; $('#err').classList.add('hidden');
  try {
    const r = await api('/api/auth/login', { method: 'POST', body: { email: $('#email').value.trim(), password: $('#pw').value } });
    staff.set(r); location.href = r.role === 'admin' ? 'admin.html' : 'doctor.html';
  } catch (er) { $('#err').textContent = er.message; $('#err').classList.remove('hidden'); b.disabled = false; }
};
</script></body></html>
